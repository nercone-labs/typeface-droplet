name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 30.0.16248370

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)"
          gradle_version="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          echo "tag=$tag Cargo.toml=$cargo_version app=$gradle_version"
          [ "$tag" = "$cargo_version" ] && [ "$tag" = "$gradle_version" ]
      - run: cargo test --workspace --locked

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools "ndk;${{ env.NDK_VERSION }}"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      # Signed only when the repository has the signing secrets; otherwise the unsigned APK is published.
      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          name="typeface-droplet-${GITHUB_REF_NAME}"
          unsigned="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          if [ -z "$KEYSTORE_BASE64" ]; then
            cp "$unsigned" "$name.apk"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "$name.apk" "$unsigned"
            "$apksigner" verify "$name.apk"
            rm "$RUNNER_TEMP/release.jks"
          fi
          sha256sum typeface-droplet-*.apk > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" typeface-droplet-*.apk SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
